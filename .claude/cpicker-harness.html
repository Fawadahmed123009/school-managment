<!DOCTYPE html>

  <title>ClassPicker verification harness</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background: var(--paper); padding: 24px; }
    .harness-grid { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
    .harness-col { flex: 1 1 440px; max-width: 560px; }
    .panel { margin-bottom: 16px; }
    h2 { margin-top: 0; }

  <!--
    Verifies the shared ClassPicker under the PRODUCTION Content-Security-Policy
    (see .claude/cpicker-preview-server.js, which mirrors app/app.js: no
    'unsafe-inline' on script-src). This page contains NO inline executable
    <script> — data travels via <script type="application/json"> islands and
    class-picker.js auto-initialises every [data-cpicker] element, exactly like
    views/tests/manage.ejs and views/tests/sessions.ejs now do. Submission is
    inspected from the test driver via preview_eval, not an inline handler.
  -->
  <div class="harness-grid">
    <div class="harness-col">
      <div class="panel">
        <div class="panel-head"><h2>Test creation form</h2></div>
        <div class="panel-body">
          <form id="form-manage" method="POST" action="#">
            <div class="field">
              <label>Classes / sections</label>
              <div id="cpicker-manage"
                   data-cpicker
                   data-cpicker-source="cpicker-manage-classes"
                   data-cpicker-field="classLevels"
                   data-cpicker-required></div>
              <p class="hint">manage.ejs pattern — required</p>
            </div>
            <button type="submit" class="btn btn-primary">Create test</button>
          </form>
        </div>
      </div>
    </div>
    <div class="harness-col">
      <div class="panel">
        <div class="panel-head"><h2>Session creation form</h2></div>
        <div class="panel-body">
          <form id="form-sessions" method="POST" action="#">
            <div class="field">
              <label>Classes included</label>
              <div id="cpicker-sessions"
                   data-cpicker
                   data-cpicker-source="cpicker-sessions-classes"
                   data-cpicker-field="classLevels"></div>
              <p class="hint">sessions.ejs pattern — optional</p>
            </div>
            <button type="submit" class="btn btn-primary">Create session</button>
          </form>
        </div>
      </div>
    </div>
  </div>
